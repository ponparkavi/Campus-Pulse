version: '3.8'

services:
  db:
    image: postgres:15
    container_name: campuspulse_db
    environment:
      POSTGRES_USER: campuspulse_user
      POSTGRES_PASSWORD: campuspulse_password
      POSTGRES_DB: campuspulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: campuspulse_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
